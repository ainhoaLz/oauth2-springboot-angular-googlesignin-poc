services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agprueba
    ports:
      - "3306:3306"
    networks:
      - aghair-network

  auth-server:
    build: ./authorization-server
    ports:
      - "9000:9000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/agprueba?createDatabaseIfNotExist=true
    depends_on:
      - mysql-db
    networks:
      - aghair-network

  resource-server:
    build: ./resource-server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/agprueba?createDatabaseIfNotExist=true
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:9000
    depends_on:
      - auth-server
    networks:
      - aghair-network

  frontend:
    build: ./ag-prueba-front
    ports:
      - "4200:80"
    depends_on:
      - resource-server
    networks:
      - aghair-network

networks:
  aghair-network:
    driver: bridge
