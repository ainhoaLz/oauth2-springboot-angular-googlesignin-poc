services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${DB_PORT}:3306"
    networks:
      - aghair-network

  auth-server:
    build: ./authorization-server
    ports:
      - "${AUTH_SERVER_PORT}:9000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true
    depends_on:
      - mysql-db
    networks:
      - aghair-network

  resource-server:
    build: ./resource-server
    ports:
      - "${RESOURCE_SERVER_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:9000
    depends_on:
      - auth-server
    networks:
      - aghair-network

  frontend:
    build: ./ag-prueba-front
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - resource-server
    networks:
      - aghair-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - aghair-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - aghair-network

networks:
  aghair-network:
    driver: bridge
